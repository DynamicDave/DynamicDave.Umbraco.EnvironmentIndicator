name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PACKAGE: DynamicDave.Umbraco.EnvironmentIndicator
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/${{ env.PACKAGE }}/Client/package-lock.json

      # Built as a separate step (not by the MSBuild BuildClient target), so the static web assets
      # are on disk before MSBuild collects them.
      - name: Build client
        working-directory: src/${{ env.PACKAGE }}/Client
        run: |
          npm ci
          npm run build

      - name: Test
        run: dotnet test tests/${{ env.PACKAGE }}.Tests -c Release -p:SkipClientBuild=true

      - name: Pack
        run: dotnet pack src/${{ env.PACKAGE }} -c Release -p:SkipClientBuild=true -p:ContinuousIntegrationBuild=true -o artifacts

      # The package is compiled against Umbraco 17.0.0 but must also install and compile on the newest supported
      # Umbraco. The TestSite references the package the way a real site does.
      - name: Build on Umbraco 18
        run: dotnet build tests/TestSite -c Release -p:SkipClientBuild=true -p:TestSiteUmbracoVersion=18.2.1

      # The package is built against its minimum Umbraco version, whose own dependencies may have advisories that
      # sites on a newer version never get. The TestSite installs the package on the latest supported Umbraco 17
      # and 18, like a real site.
      - name: Check NuGet dependencies for known vulnerabilities
        run: |
          for version in 17.7.0 18.2.1; do
            dotnet restore tests/TestSite -p:TestSiteUmbracoVersion=$version
            dotnet list tests/TestSite package --vulnerable --include-transitive --no-restore | tee -a vulnerable.txt
          done
          if grep -q "has the following vulnerable packages" vulnerable.txt; then exit 1; fi

      - name: Check runtime npm dependencies for known vulnerabilities
        working-directory: src/${{ env.PACKAGE }}/Client
        run: npm audit --omit=dev --audit-level=high

      - uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: artifacts/*.nupkg
